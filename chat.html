<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ShareMyDish – Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./style.css" />
  <style>
    .chatWrap { max-width: 720px; margin: 24px auto; padding: 0 16px; }
    .chatCard { background:#fff; border:1px solid #eee; border-radius:12px; padding:16px; box-shadow:0 6px 24px rgba(0,0,0,.06); }
    .meta { font-size:14px; opacity:.8; margin-bottom:10px; }
    .msgList { border:1px solid #eee; border-radius:10px; padding:10px; height: 360px; overflow:auto; background:#fafafa; }
    .msg { margin:6px 0; }
    .msg.you { text-align:right; }
    .msg .bubble {
      display:inline-block; padding:8px 10px; border-radius:10px; background:#fff; border:1px solid #ddd;
      max-width: 80%;
    }
    .composer { display:flex; gap:8px; margin-top:10px; }
    .composer input[type="text"] { flex: 0 0 160px; padding:8px; border:1px solid #ddd; border-radius:10px; }
    .composer input[type="search"] { flex:1; padding:8px; border:1px solid #ddd; border-radius:10px; }
  </style>
</head>
<body>
  <div class="chatWrap">
    <h2 id="postTitle">Chat</h2>
    <div class="chatCard">
      <div class="meta" id="postMeta"></div>
      <div class="msgList" id="msgList"></div>
      <div class="composer">
        <input id="whoInput" type="text" placeholder="Your name (required)" />
        <input id="textInput" type="search" placeholder="Type a message..." />
        <button id="sendBtn" class="btn primary">Send</button>
      </div>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script>
    (async function () {
      const qs = new URLSearchParams(location.search);
      const postId = qs.get("postId");
      if (!postId) { alert("Missing postId"); return; }

      const post = await window.SMD_API.getPostById(postId);
      if (!post) { alert("Post not found."); return; }

      const titleEl = document.getElementById("postTitle");
      const metaEl = document.getElementById("postMeta");
      titleEl.textContent = `Chat – ${post.title}`;
      metaEl.textContent = `Location: ${post.lat.toFixed(5)}, ${post.lng.toFixed(5)} · Posted: ${new Date(post.postedAt).toLocaleString()}`;

      const listEl = document.getElementById("msgList");
      const whoEl = document.getElementById("whoInput");
      const textEl = document.getElementById("textInput");
      const sendBtn = document.getElementById("sendBtn");

      async function refresh() {
        const msgs = await window.SMD_API.getMessages(postId);
        listEl.innerHTML = "";
        msgs.forEach(m => {
          const d = document.createElement("div");
          d.className = "msg" + (whoEl.value && m.from === whoEl.value.trim() ? " you" : "");
          d.innerHTML = `<span class="bubble"><strong>${escapeHtml(m.from)}:</strong> ${escapeHtml(m.text)}<br><small>${new Date(m.ts).toLocaleString()}</small></span>`;
          listEl.appendChild(d);
        });
        listEl.scrollTop = listEl.scrollHeight;
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
      }

      sendBtn.onclick = async () => {
        const who = whoEl.value.trim();
        const text = textEl.value.trim();
        if (!who) return alert("Please enter your name.");
        if (!text) return;
        await window.SMD_API.postMessage(postId, who, text);
        textEl.value = "";
        await refresh();
      };

      await refresh();
      // simple polling for demo
      setInterval(refresh, 3000);
    })();
  </script>
</body>
</html>
