<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ShareMyDish – Community Food Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Mode selection overlay -->
  <div id="modeOverlay" class="overlay">
    <div class="overlay-card">
      <h2>Select your mode</h2>
      <p>Please choose what you want to do today.</p>
      <div class="overlay-actions">
        <button id="modeUpload" class="btn primary">I want to upload</button>
        <button id="modePickup" class="btn">I want to pick up</button>
      </div>
      <small>Your choice only affects the map UI behavior.</small>
    </div>
  </div>

  <!-- In-map hint banner (shows current mode + Change mode) -->
  <div id="modeHint" class="mode-hint" style="display:none;"></div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Floating Locate button -->
  <button id="locateBtn" class="fab-locate" aria-label="Locate me">📍</button>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- App scripts -->
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/map.js"></script>

  <!-- Inject Google Maps using the key from config.js -->
  <script>
    (function () {
      const key = window.SMD_CONFIG?.GOOGLE_MAPS_API_KEY;
      if (!key) { alert("Missing GOOGLE_MAPS_API_KEY in js/config.js"); return; }
      const s = document.createElement("script");
      s.src = "https://maps.googleapis.com/maps/api/js?key=" +
              encodeURIComponent(key) + "&callback=initMap";
      s.async = true; s.defer = true;
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
