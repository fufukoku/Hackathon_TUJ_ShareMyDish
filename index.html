<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ShareMyDish – Community Food Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Mode selection overlay -->
  <div id="modeOverlay" class="overlay">
    <div class="overlay-card">
      <h2>Select your mode</h2>
      <p>Please choose what you want to do today.</p>
      <div class="overlay-actions">
        <button id="modeUpload" class="btn primary">I want to upload</button>
        <button id="modePickup" class="btn">I want to pick up</button>
      </div>
      <small>Your choice only affects the map UI behavior.</small>
    </div>
  </div>

  <!-- Top control bar (visible in Upload mode for convenience) -->
  <div class="panel" id="topPanel" style="display:none;">
    <strong>ShareMyDish</strong>
    <input id="titleInput" type="text" placeholder="Dish title (e.g., Extra Bento)" />
    <input id="descInput" type="text" placeholder="Short note (optional here)" />
    <select id="catInput" title="Category">
      <option>🍱 Bento</option>
      <option>🍞 Bread</option>
      <option>🍛 Cooked</option>
      <option>🍎 Fruit</option>
      <option selected>🥗 Other</option>
    </select>
    <button id="addModeBtn" class="btn">Add Mode: OFF</button>
    <button id="locateBtn" class="btn">📍 Locate me</button>
  </div>

  <div id="map"></div>
  <div id="toast" class="toast"></div>

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/map.js"></script>

  <!-- Inject Google Maps using the key from config.js -->
  <script>
    (function () {
      const key = window.SMD_CONFIG?.GOOGLE_MAPS_API_KEY;
      if (!key) { alert("Missing GOOGLE_MAPS_API_KEY in js/config.js"); return; }
      const s = document.createElement("script");
      s.src = "https://maps.googleapis.com/maps/api/js?key=" +
              encodeURIComponent(key) + "&callback=initMap";
      s.async = true; s.defer = true;
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
