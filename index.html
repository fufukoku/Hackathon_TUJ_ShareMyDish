<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ShareMyDish – Community Food Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="panel">
    <strong>ShareMyDish</strong>
    <input id="titleInput" type="text" placeholder="Dish title (e.g., Extra Bento)" />
    <input id="descInput" type="text" placeholder="Short note (e.g., free until 6pm)" />
    <select id="catInput" title="Category">
      <option>🍱 Bento</option>
      <option>🍞 Bread</option>
      <option>🍛 Cooked</option>
      <option>🍎 Fruit</option>
      <option selected>🥗 Other</option>
    </select>
    <input id="expireInput" type="number" min="1" max="48" value="6" title="Expires in hours" />
    <button id="addModeBtn" class="btn">Add Mode: OFF</button>
    <button id="locateBtn" class="btn">📍 Locate me</button>
    <button id="resetBtn" class="btn">↺ Reset demo</button>
  </div>

  <div id="map"></div>
  <div id="toast" class="toast"></div>

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/map.js"></script>

  <script>
    (function () {
      const key = window.SMD_CONFIG?.GOOGLE_MAPS_API_KEY;
      if (!key) { alert("Missing GOOGLE_MAPS_API_KEY in js/config.js"); return; }
      const s = document.createElement("script");
      s.src = "https://maps.googleapis.com/maps/api/js?key=" +
              encodeURIComponent(key) + "&callback=initMap";
      s.async = true; s.defer = true;
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
